# The /_/api/history path of openapi.yaml. The root spec references this
# file, so the reference page shows a spec in more than one file.
get:
  operationId: getHistory
  tags: [Git]
  summary: Get the history of a file
  description: |
    Returns the commits that changed a file, newest first, with
    renames followed. The list has a maximum of 100 commits. The base
    picker of a file page uses it.

    The response also tells the client if it can offer a diff against
    the main branch. The viewer finds the main branch by name. It uses
    the first of these branches that exists: the local branch `main`,
    the local branch `master`, `origin/main`, `origin/master`.
  parameters:
    - name: path
      in: query
      required: true
      description: The repository path of a file that the viewer shows.
      schema:
        type: string
      example: docs/USAGE.md
  responses:
    '200':
      description: The branch state and the commits.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/History'
          example:
            branch: add-search-filters
            main: main
            branchBase: true
            commits:
              - hash: 9f2c1e7a4b3d5c6e8f0a1b2c3d4e5f60718293a4
                short: 9f2c1e7
                subject: (docs) Describe the search filters
                author: A. Writer
                date: '2026-09-26T11:44:07-04:00'
                path: docs/NAVIGATION.md
    '404':
      description: |
        The viewer has no git access, the `path` parameter is absent
        or not permitted, or the path is not a file.
      content:
        text/plain:
          schema:
            type: string
          example: 404 page not found
    '405':
      $ref: '../openapi.yaml#/components/responses/MethodNotAllowed'
    '500':
      description: |
        The viewer cannot read the documentation directory, or the git
        command failed.
      content:
        text/plain:
          schema:
            type: string
          example: 'Cannot read the history: git log: signal: killed'
